name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find Android project
        id: proj
        run: |
          echo "Repository files:"
          ls -la
          F=$(find . -name settings.gradle.kts | head -1)
          if [ -z "$F" ]; then
            echo "::error::settings.gradle.kts not found. Upload ALL project files (app folder, build.gradle.kts, settings.gradle.kts, gradle.properties) to the repository."
            exit 1
          fi
          D=$(dirname "$F")
          if [ ! -f "$D/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle.kts not found. The app folder is missing - upload it too."
            exit 1
          fi
          echo "Project dir: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: office-id-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
